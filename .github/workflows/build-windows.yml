
name: Gerar EXE do Football Brasil Manager

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar aplicativo
        run: npm run dist

      - name: Disponibilizar EXE
        uses: actions/upload-artifact@v4
        with:
          name: Football-Brasil-Manager-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
