<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football Brasil Manager</title>
<style>
 :root{--bg:#17171d;--sf:#24242c;--tx:#f0f0f4;--mu:#a7a7b5;--ac:#7652c8;--bd:#3b3b47;--rd:#ef6464;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}

*{box-sizing:border-box}

main{max-width:1200px;margin:0 auto;padding:14px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;align-items:start}
.card input{max-width:100%}
.hero{background:linear-gradient(135deg,#24242c 0%,#393044 100%);color:#fff;border-radius:16px;padding:34px 20px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 24px,transparent 24px 48px)}
.hero>*{position:relative;z-index:1}
.hl{font-size:46px}.hmt{font-size:24px;font-weight:800;letter-spacing:.08em}.hms{opacity:.85;margin-top:4px;letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:14px;min-height:130px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;text-align:left;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.tile b{text-transform:uppercase;letter-spacing:.04em}
.tile i{font-style:normal;font-size:34px;margin-bottom:auto}
.tile small{font-weight:400;color:var(--mu)}
.tile.big{background:linear-gradient(135deg,#7652c8,#51368e);color:#fff;border:0}
.tile.big small{color:#d6f0e0}
.sd{display:inline-flex;width:44px;height:44px;border-radius:50% 50% 50% 50%/30% 30% 70% 70%;align-items:center;justify-content:center;font-size:24px;margin-bottom:auto}
h1{font-size:20px;margin:4px 0 10px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}

button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}

/* Navegação lateral inspirada em Football Manager */
main{max-width:none;margin:0 0 0 238px;padding:18px 24px;min-height:100vh}
#app{max-width:1500px;margin:0 auto}
nav{position:fixed;left:0;top:0;bottom:0;width:220px;z-index:50;display:flex;flex-direction:column;align-items:stretch;gap:5px;margin:0;padding:18px 12px 20px;overflow-y:auto;background:#202027;border-right:1px solid #3b3b47;box-shadow:6px 0 24px #0002}
nav::before{content:"⚽ FOOTBALL\A BRASIL MANAGER";white-space:pre-line;display:block;color:#b7f34a;font-weight:900;letter-spacing:.06em;line-height:1.5;font-size:17px;padding:8px 9px 20px;margin-bottom:8px;border-bottom:1px solid var(--bd)}
nav button{display:block;width:100%;text-align:left;border-radius:7px;padding:11px 12px;background:transparent;color:#d8d8e1;border:1px solid transparent;font-weight:650}
nav button.sec{background:transparent;border-color:transparent;color:#c2c2cf}
nav button:hover{background:#30303b;border-color:#444451;filter:none}
nav button.on{background:linear-gradient(90deg,#7652c8,#5b4099);color:#fff;border-color:#8a6bd1;box-shadow:inset 3px 0 #b7f34a}
nav button:last-child{margin-top:3px}
nav button:nth-last-child(2){margin-top:auto;border-top:1px solid #3b3b47}
nav button.on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:600;font-size:12px}
tr.me{background:color-mix(in srgb,var(--ac) 18%,transparent)}
tr.sel{background:color-mix(in srgb,var(--ac) 22%,transparent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pos{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--bd);color:var(--tx)}
.score{font-size:30px;font-weight:700;text-align:center}
#log{max-height:260px;overflow:auto;font-size:14px}
#log div{padding:2px 0;border-bottom:1px dashed var(--bd)}
.goal{color:var(--ac);font-weight:700}.mu{color:var(--mu)}
input,select,textarea{background:#1d1d24;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px}
button:hover{filter:brightness(1.12)}
a{color:#bba4ff}
.card{box-shadow:0 2px 8px rgba(0,0,0,.12)}

 nav::before{content:"FBM";white-space:normal;flex:0 0 auto;font-size:13px;padding:8px;margin:0 5px 0 0;border:0;border-right:1px solid var(--bd)}
 nav button,nav button.sec{width:auto;flex:0 0 auto;white-space:nowrap;padding:9px 11px}
 nav button:nth-last-child(2){margin-top:0;border-top:0}
 .three[style*="minmax(0,1.5fr)"]{grid-template-columns:1fr!important}.pitch{min-height:520px!important}.pitch select{max-width:76px}
}

.live-pitch-card{border:1px solid #287c4e}.live-pitch{margin-top:12px;background:#17683d;border-radius:10px;overflow:hidden;box-shadow:0 8px 28px #0005}.live-legend{gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:8px}.live-legend span{display:flex;align-items:center;gap:6px}.live-legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid #fff}

/* Consulta de clube em layout compacto inspirado em jogos de gestão */
.club-browser{color:#e6e9e8}.club-browser-head{display:flex;align-items:end;justify-content:space-between;gap:18px;padding:10px 4px 18px;border-bottom:1px solid #343d3a}.club-eyebrow{font-size:10px;letter-spacing:.15em;font-weight:800;color:#b7f34a;margin-bottom:5px}.club-browser-head h1{font-size:26px;margin:0 0 5px}.club-search{display:flex;align-items:center;gap:9px;width:min(390px,100%);padding:7px 12px;background:#202825;border:1px solid #45524c;border-radius:5px}.club-search span{font-size:25px;color:#b7f34a}.club-search input{width:100%;border:0;background:transparent;outline:none}.club-filters{display:flex;align-items:end;gap:14px;padding:13px 4px;background:#222925;border-bottom:1px solid #3b4540}.club-filters label{display:grid;gap:4px;color:#aeb9b2;font-size:11px;text-transform:uppercase}.club-filters select{min-width:180px;padding:6px;background:#303a34;border-radius:3px}.club-count{margin-left:auto;color:#b7f34a;font-size:12px}.club-results{margin-top:12px;background:#1d2421;border:1px solid #36423b}.club-results-title{padding:11px 13px;font-size:11px;font-weight:800;letter-spacing:.12em;color:#b7f34a;border-bottom:1px solid #354139}.club-team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:#303a34}.club-team{display:flex;align-items:center;gap:12px;text-align:left;background:#202825;border-radius:0;padding:12px}.club-team:hover{background:#2d3932}.club-crest{width:44px;display:flex;align-items:center;justify-content:center}.club-team-info{display:grid;gap:4px;flex:1}.club-team-info small{font-size:11px;color:#a6b1aa}.club-arrow{font-size:24px;color:#b7f34a}.club-detail-head{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 8px 14px}.club-detail-identity{display:flex;align-items:center;gap:14px}.club-detail-head h2{font-size:24px;margin:0 0 4px}.club-mini-tabs{display:flex;gap:0;border-bottom:1px solid #455149;background:#222925}.club-mini-tabs button{padding:11px 18px;font-size:11px;font-weight:800;letter-spacing:.08em;color:#9ca9a0;background:transparent;border:0;border-radius:0;cursor:pointer}.club-mini-tabs button:hover{color:#fff;background:#303a34}.club-mini-tabs button.active{color:#b7f34a;border-bottom:3px solid #b7f34a}.club-roster-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 4px}.club-pos-filters{display:flex;gap:4px;flex-wrap:wrap}.club-pos-filters button{padding:5px 11px;font-size:11px;background:#303a34;border:1px solid #46534b;border-radius:3px}.club-pos-filters button.active{background:#31583d;color:#c7ff80;border-color:#75a64d}.club-roster-wrap{overflow:auto;border:1px solid #37423c;background:#252c29}.club-roster{min-width:720px;font-size:12px}.club-roster th{background:#303934;color:#aeb9b2;font-size:10px;letter-spacing:.07em;padding:9px 8px}.club-roster td{padding:5px 8px;border-bottom:1px solid #39423d;height:37px}.club-roster tbody tr:nth-child(even){background:#2b3330}.club-roster tbody tr:hover{background:#39483e}.club-number{color:#9eaaa2;width:35px}.club-player{display:flex;align-items:center;gap:9px;min-width:180px}.club-player-photo{width:27px;height:27px;border-radius:50%;background:#3d4c43;border:1px solid #6a7c6f;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#d8f4d7;overflow:hidden}.club-player-photo img{width:100%;height:100%;object-fit:cover}.club-pos-tag{display:inline-block;min-width:34px;text-align:center;background:#3b4840;color:#d5e3d9;padding:3px 5px;border-radius:2px;font-size:10px}.club-rating{display:inline-block;min-width:28px;text-align:center;padding:3px;background:#3b4540;border-radius:2px}.club-rating.high{background:#466b35;color:#d8ffb5}.club-status{font-size:10px;color:#b7f34a}.club-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.club-info-grid h3{margin:0 0 8px;font-size:13px}.club-title-row{padding:5px 0;border-bottom:1px solid var(--bd)}
@media(max-width:760px){.club-browser-head,.club-detail-head{align-items:stretch;flex-direction:column}.club-search{width:100%}.club-filters{align-items:stretch;flex-direction:column}.club-filters select{width:100%}.club-count{margin-left:0}.club-info-grid{grid-template-columns:1fr}.club-detail-head h2{font-size:20px}}

</style></head><body><main>
<h1 id="ttl">Football Brasil Manager</h1><div id="app"></div>
<div id="backupTools" style="position:fixed;right:12px;bottom:12px;z-index:1000;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);display:flex;gap:6px;align-items:center;flex-wrap:wrap">
  <strong style="font-size:12px">Dados</strong>
  <button type="button" onclick="exportGameBackup()" style="padding:6px 9px">Exportar backup</button>
  <button type="button" class="sec" onclick="document.getElementById('backupInput').click()" style="padding:6px 9px">Importar backup</button>
  <input id="backupInput" type="file" accept="application/json,.json" hidden onchange="importGameBackup(this)">
</div>
</main>
<script>
const NAMES=["Rafael","Bruno","Lucas","Diego","Thiago","Caio","Mateus","Felipe","Gustavo","Pedro","João","André","Renan","Igor","Vitor","Hugo","Leandro","Marcos","Davi","Elias"];
const SURN=["Silva","Souza","Costa","Lima","Rocha","Alves","Dias","Nunes","Melo","Pinto","Freitas","Barros","Moura","Cardoso","Teixeira"];
const TEAMS=["Atlético Patense","Vila Nova FC","Cruzeiro do Sul","Tricolor da Serra","Real Cerrado","União Mineira","Estrela Verde","Sport Planalto"];
const FORM={"4-4-2":[4,4,2],"4-3-3":[4,3,3],"3-5-2":[3,5,2],"5-3-2":[5,3,2],"4-2-3-1":[4,5,1],"4-1-4-1":[4,5,1],"4-5-1":[4,5,1],"4-2-2-2":[4,4,2],"4-3-2-1":[4,5,1],"3-4-3":[3,4,3],"3-4-2-1":[3,6,1],"3-4-1-2":[3,5,2],"3-6-1":[3,6,1],"5-4-1":[5,4,1],"5-2-3":[5,2,3],"4-2-4":[4,2,4]};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)];
const gameStorage=window.desktopStorage||window.localStorage;
let G=null;
const ICONS=["🦅","🦁","🐺","🐯","🐻","🐍","🦈","🐂","⭐","🔥","⚡","👑","🛡️","⚓","🌵","🌳"];const COLS=["#1f8a4c","#c0392b","#2c5fb3","#d4a017","#7b3fa0","#222222","#e67e22","#16a5a5"];
function mkTeam(n,i){const base=62+rnd(-6,8);const sq=[];let id=0;
 [["GK",2],["DEF",5],["MID",5],["ATT",4]].forEach(([p,c])=>{for(let k=0;k<c;k++)sq.push({id:id++,n:pick(NAMES)+" "+pick(SURN),p,o:Math.max(40,Math.min(92,base+rnd(-9,9))),g:0,nac:Math.random()<.85?"Brasil":pick(Object.keys(FLAGS))})});
 return{id:i,name:n,ic:ICONS[i*2%ICONS.length],col:COLS[i%COLS.length],sq,form:"4-4-2",xi:[],pts:0,j:0,v:0,e:0,d:0,gp:0,gc:0}}
function autoXI(t){const f=FORM[t.form],need={GK:1,DEF:f[0],MID:f[1],ATT:f[2]},xi=[];
 for(const p in need)t.sq.filter(x=>x.p==p).sort((a,b)=>b.o-a.o).slice(0,need[p]).forEach(x=>xi.push(x.id));t.xi=xi}
function fixtures(n){let ids=[...Array(n).keys()],r=[];for(let k=0;k<n-1;k++){const m=[];for(let i=0;i<n/2;i++)m.push([ids[i],ids[n-1-i]]);r.push(m);ids=[ids[0],ids[n-1],...ids.slice(1,n-1)]}
 return[...r,...r.map(m=>m.map(([a,b])=>[b,a]))]}
function newGame(me){const teams=TEAMS.map(mkTeam);teams.forEach(autoXI);G={me,teams,fx:fixtures2(8),rd:0,last:null,tab:"jogo",seasonYear:2026};ROOT=load()||{comps:[],cur:0};G.lg={name:"Carreira "+(ROOT.comps.length+1),ic:"🏆",img:null,hist:[]};ROOT.comps.push(G);ROOT.cur=ROOT.comps.length-1;save()}
function save(){try{gameStorage.setItem("mm2",JSON.stringify(ROOT))}catch(e){}}
function normalizeGlobalComps(root){
 if(!root||!Array.isArray(root.comps))return root;
 const key=c=>{const raw=String(c&&c.globalType||"").toLowerCase();const name=String(c&&c.lg&&c.lg.name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();if(raw==="fifa-club-world-cup"||/mundial de clubes/.test(name))return "fifa-club-world-cup";if(raw==="fifa-intercontinental-cup"||/intercontinental/.test(name))return "fifa-intercontinental-cup";return ""};
 const seen={},remove=[];root.comps.forEach((c,i)=>{const k=key(c);if(!k)return;if(!c.globalType)c.globalType=k;const first=seen[k];if(first===undefined){seen[k]=i;return}const main=root.comps[first];
  const teamKey=t=>String(t&&t.name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
  if(!Array.isArray(main.teams))main.teams=[];for(const t of (c.teams||[])){const tk=teamKey(t);if(tk&&!main.teams.some(x=>teamKey(x)===tk))main.teams.push(t)}
  if(!main.lg)main.lg={name:k==="fifa-club-world-cup"?"Mundial de Clubes FIFA":"Copa Intercontinental FIFA",hist:[]};if(!Array.isArray(main.lg.hist))main.lg.hist=[];
  for(const h of ((c.lg&&c.lg.hist)||[])){const sig=JSON.stringify(h);if(!main.lg.hist.some(x=>JSON.stringify(x)===sig))main.lg.hist.push(h)}
  if(!main.globalFormat&&c.globalFormat)main.globalFormat=c.globalFormat;if(!main.globalStatus&&c.globalStatus)main.globalStatus=c.globalStatus;
  remove.push(i);
 });
 if(remove.length){const oldCur=Number.isInteger(root.cur)?root.cur:0;const removedBefore=remove.filter(i=>i<oldCur).length;root.comps=root.comps.filter((_,i)=>!remove.includes(i));root.cur=Math.max(0,Math.min(root.comps.length-1,oldCur-removedBefore));try{gameStorage.setItem("mm2",JSON.stringify(root))}catch(e){}}
 return root;
}
function load(){try{const s=gameStorage.getItem("mm2");if(s)return ensureClubCatalog(normalizeGlobalComps(JSON.parse(s)));const o=gameStorage.getItem("mm1");if(o)return ensureClubCatalog({comps:[JSON.parse(o)],cur:0})}catch(e){}return null}
function str(t){const xi=t.xi.map(i=>t.sq[i]);const av=p=>{const a=xi.filter(x=>x.p==p);return a.length?a.reduce((s,x)=>s+x.o,0)/a.length:30};
 return{A:av("ATT")*.6+av("MID")*.4,M:av("MID"),D:av("DEF")*.7+av("GK")*.3}}
function valid(t){const xi=t.xi.map(i=>t.sq[i]);return xi.length==11&&xi.filter(x=>x.p=="GK").length==1}
function sim(h,a,log){const H=str(h),A=str(a);let gh=0,ga=0;
 const sc=t=>{const c=t.xi.map(i=>t.sq[i]).filter(x=>x.p!="GK"&&x.p!="DEF"||Math.random()<.15);const w=c.map(x=>x.o*(x.p=="ATT"?2:1));let r=Math.random()*w.reduce((s,y)=>s+y,0);for(let i=0;i<c.length;i++){r-=w[i];if(r<=0)return c[i]}return c[0]};
 const ev=[];
 for(let m=1;m<=90;m++){const ph=(H.M+3)/(H.M+A.M+6);
  if(Math.random()<.13){const homeAtk=Math.random()<ph*1.04,at=homeAtk?H:A,df=homeAtk?A:H,T=homeAtk?h:a;
   const q=at.A/df.D;if(Math.random()<.55*q*q*.55){const p=sc(T);p.g++;if(homeAtk)gh++;else ga++;ev.push({m,t:`⚽ GOL! ${p.n} (${T.name}) marca! ${gh} x ${ga}`,g:1,gh,ga})}
   else if(Math.random()<.4)ev.push({m,t:`${T.name} chega com perigo, mas a defesa afasta.`,gh,ga})}}
 return{gh,ga,ev}}
function playRound(onMe){const out=[];G.fx[G.rd].forEach(([hi,ai])=>{const h=G.teams[hi],a=G.teams[ai];
 [h,a].forEach(t=>{if(t.id!=G.me)autoXI(t)});
 const r=sim(h,a);apply(h,a,r.gh,r.ga);out.push({h:h.name,a:a.name,gh:r.gh,ga:r.ga,hi,ai,ev:r.ev})});return out}
function apply(h,a,gh,ga){(G.res=G.res||{})[G.rd+"-"+h.id+"-"+a.id]=[gh,ga];h.j++;a.j++;h.gp+=gh;h.gc+=ga;a.gp+=ga;a.gc+=gh;
 if(gh>ga){h.v++;h.pts+=3;a.d++}else if(gh<ga){a.v++;a.pts+=3;h.d++}else{h.e++;a.e++;h.pts++;a.pts++}}
function table(){return[...G.teams].sort((a,b)=>b.pts-a.pts||(b.gp-b.gc)-(a.gp-a.gc)||b.gp-a.gp)}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
function sh(t,s=28){s=s<=24?SZ_S:SZ_L;const c=t.col||"#1f8a4c";return t.img?`<img src="${(s==SZ_S?t.imgS:t.imgL)||t.img}" alt="" style="width:${s}px;height:${s}px;object-fit:contain;vertical-align:middle">`:`<span style="display:inline-flex;align-items:center;justify-content:center;width:${s}px;height:${s}px;border-radius:50% 50% 50% 50%/30% 30% 70% 70%;background:${c};font-size:${Math.round(s*.55)}px;vertical-align:middle">${t.sel&&FB[t.pais]?flagSvg(t.pais,Math.round(s*.5)):(t.ic||"⚽")}</span>`}
const lv=o=>o>=85?"Lendário":o>=75?"Craque":o>=65?"Bom":o>=55?"Regular":"Fraco";
const SORTS={o:(a,b)=>b.o-a.o,n:(a,b)=>a.n.localeCompare(b.n),p:(a,b)=>"GK DEF MID ATT".indexOf(a.p)-"GK DEF MID ATT".indexOf(b.p)||b.o-a.o};
function ovr(t){if(!t.sq.length)return 0;return Math.round(t.sq.reduce((s,p)=>s+p.o,0)/t.sq.length)}
function ed(k,v){const t=G.teams[G.et??G.me];t[k]=v;if(k=="ic")t.img=null;save();render()}

function officialCalendarWindow(c){

 if(/serie\s*d|brasileiro.*serie d/.test(name))return window([4,5],[9,13]);
 if(/copa do brasil/.test(name))return window([2,18],[12,6]);
 if(/copa do nordeste|copa verde|copa sul.sudeste/.test(name))return window([3,25],[6,7]);
 if(/estadual|campeonato mineiro|campeonato paulista|campeonato carioca|campeonato gaucho|campeonato paranaense|campeonato baiano|campeonato pernambucano/.test(name))return window([1,11],[3,8]);

function preAssign(slot,id){const t=G.teams[G.me],slots=preSlots(),old=(t.tactics&&t.tactics.slots)||t.xi.slice(0,11);while(old.length<11)old.push(null);const idx=+slot,pl=t.sq.find(p=>p.id===+id);if(!pl)return;const same=old.indexOf(pl.id);if(same>=0&&same!==idx)old[same]=old[idx]??null;old[idx]=pl.id;t.tactics=t.tactics||{};t.tactics.slots=old;t.xi=old.filter(x=>x!=null);save();render()}
function preStrategy(k,v){const t=G.teams[G.me];t.tactics=t.tactics||{};t.tactics[k]=v;save()}

 const t=G&&G.teams&&G.teams[G.me];if(!t)return alert("Não foi possível localizar seu clube.");

let CALLUP_FILTER={q:"",country:"Brasil",comp:"all",pos:"all",min:0,max:99,tournament:"Copa América",target:""};
function callupPlayerRef(ci,ti,pi){return `${ci}:${ti}:${pi}`}
function callupPlayer(ref){if(!ROOT||!ref)return null;const a=String(ref).split(':').map(Number);if(a.length!==3||a.some(n=>!Number.isFinite(n)))return null;const c=ROOT.comps[a[0]],t=c&&(c.teams||[])[a[1]];const p=t&&(t.sq||[]).find(x=>String(x.id)===String(a[2]));return p?{p,t,c,ci:a[0],ti:a[1],ref}:null}
function callupCountry(p){return String(p.nac||p.nationality||p.country||'').trim()}
function callupList(){ROOT=load()||ROOT||{comps:[],cur:0};ROOT.callups=ROOT.callups||{};const country=CALLUP_FILTER.country||'Brasil',tour=(CALLUP_FILTER.tournament||'Copa América').trim()||'Copa América',key=country+'|'+tour;const refs=ROOT.callups[key]||[];const comps=(ROOT.comps||[]).map((c,ci)=>({c,ci})).filter(x=>tp(x.c)!=='selecoes'&&x.c.tab!=='editor'&&(x.c.teams||[]).length);const options=[];comps.forEach(({c,ci})=>(c.teams||[]).forEach((t,ti)=>(t.sq||[]).forEach(p=>{const ref=callupPlayerRef(ci,ti,p.id);options.push({p,t,c,ci,ti,ref})})));const selected=refs.map(callupPlayer).filter(Boolean);const q=(CALLUP_FILTER.q||'').toLocaleLowerCase('pt-BR');const list=options.filter(x=>!refs.includes(x.ref)&&callupCountry(x.p).toLocaleLowerCase('pt-BR')===country.toLocaleLowerCase('pt-BR')&&(CALLUP_FILTER.comp==='all'||String(x.ci)===String(CALLUP_FILTER.comp))&&(CALLUP_FILTER.pos==='all'||x.p.p===CALLUP_FILTER.pos)&&(+x.p.o||0)>=+CALLUP_FILTER.min&&(+x.p.o||0)<=+CALLUP_FILTER.max&&(!q||(x.p.n||'').toLocaleLowerCase('pt-BR').includes(q)||(x.t.name||'').toLocaleLowerCase('pt-BR').includes(q)||(cn(x.c)||'').toLocaleLowerCase('pt-BR').includes(q))).sort((a,b)=>(+b.p.o||0)-(+a.p.o||0)||(a.p.n||'').localeCompare(b.p.n||''));return {country,tour,key,refs,selected,list,comps}}
function addCallup(ref){ROOT=load()||ROOT;ROOT.callups=ROOT.callups||{};const country=CALLUP_FILTER.country||'Brasil',tour=(CALLUP_FILTER.tournament||'Copa América').trim()||'Copa América',key=country+'|'+tour;const item=callupPlayer(ref);if(!item||callupCountry(item.p).toLocaleLowerCase('pt-BR')!==country.toLocaleLowerCase('pt-BR')){alert('Este jogador não está cadastrado com a nacionalidade selecionada.');return}const arr=ROOT.callups[key]||(ROOT.callups[key]=[]);if(arr.includes(ref))return;if(arr.length>=26){alert('A convocação já tem 26 jogadores. Remova alguém antes de adicionar outro.');return}arr.push(ref);save();render()}
function removeCallup(ref){ROOT=load()||ROOT;const key=(CALLUP_FILTER.country||'Brasil')+'|'+((CALLUP_FILTER.tournament||'Copa América').trim()||'Copa América');if(ROOT.callups&&ROOT.callups[key])ROOT.callups[key]=ROOT.callups[key].filter(x=>x!==ref);save();render()}
function nationalTargets(country){ROOT=load()||ROOT||{comps:[]};const out=[];(ROOT.comps||[]).forEach((c,ci)=>{if(tp(c)!=='selecoes')return;(c.teams||[]).forEach(t=>{if(!t||!t.sel)return;const a=String(t.pais||t.name||'').trim().toLocaleLowerCase('pt-BR'),b=String(country||'').trim().toLocaleLowerCase('pt-BR'),n=String(t.name||'').trim().toLocaleLowerCase('pt-BR');if(!b||a===b||n===b)out.push({ci,tid:t.id,c,t})})});return out}
function applyCallupToSelection(){ROOT=load()||ROOT;if(!ROOT)return;const d=callupList();if(!d.refs.length){alert('Convoca primeiro os jogadores antes de aplicar a lista à seleção.');return}const parts=String(CALLUP_FILTER.target||'').split(':').map(Number);if(parts.length!==2||parts.some(n=>!Number.isFinite(n))){alert('Escolha a seleção nacional que receberá a convocação.');return}const ci=parts[0],tid=parts[1],c=ROOT.comps[ci],t=c&&(c.teams||[]).find(x=>Number(x.id)===tid);if(!c||!t||!t.sel){alert('A seleção escolhida não foi encontrada.');return}const country=String(d.country).trim().toLocaleLowerCase('pt-BR');if(String(t.pais||t.name||'').trim().toLocaleLowerCase('pt-BR')!==country&&String(t.name||'').trim().toLocaleLowerCase('pt-BR')!==country){alert('A nacionalidade da convocação não corresponde ao país da seleção escolhida.');return}const resolved=d.refs.map(ref=>{const x=callupPlayer(ref);return x?{...x,ref}:null}).filter(Boolean);if(!resolved.length){alert('Não foi possível localizar os jogadores convocados nos elencos dos clubes.');return}t.sq=resolved.map((x,i)=>({...x.p,id:i,g:0,sourceRef:x.ref,sourceClub:x.t.name,sourceComp:cn(x.c),sourceTeamId:x.t.id}));t.xi=[];autoXI(t);t.lastCallup={country:d.country,tournament:d.tour,refs:d.refs.slice()};ROOT.cur=ci;G=c;G.et=tid;G.me=tid;G.tab='jogo';save();alert(`Convocação aplicada à seleção ${t.name}: ${t.sq.length} jogadores. O elenco foi montado a partir dos cadastros existentes nos clubes.`);render()}

style="align-items:end"><label style="flex:1;min-width:180px">Nome do jogador ou clube<br><input style="width:100%" value="${esc(CALLUP_FILTER.q)}" placeholder="Ex.: Neymar, Santos, Real Madrid" oninput="CALLUP_FILTER.q=this.value;const y=document.getElementById('callup-results');if(y)y.innerHTML=callupResultsHtml()"></label><label>Campeonato<br><select onchange="CALLUP_FILTER.comp=this.value;render()"><option value="all">Todos os campeonatos</option>${d.comps.map(x=>`<option value="${x.ci}" ${String(x.ci)===String(CALLUP_FILTER.comp)?'selected':''}>${esc(cn(x.c))}</option>`).join('')}</select></label></div><div class="row" style="margin-top:10px"><label>Posição<br><select onchange="CALLUP_FILTER.pos=this.value;render()"><option value="all">Todas</option>${[['GK','Goleiro'],['DEF','Defensor'],['MID','Meio-campista'],['ATT','Atacante']].map(([v,n])=>`<option value="${v}" ${CALLUP_FILTER.pos===v?'selected':''}>${n}</option>`).join('')}</select></label><label>Nível mínimo<br><input type="number" min="0" max="99" value="${CALLUP_FILTER.min}" style="width:78px" onchange="CALLUP_FILTER.min=Math.max(0,Math.min(99,+this.value||0));render()"></label><label>Nível máximo<br><input type="number" min="0" max="99" value="${CALLUP_FILTER.max}" style="width:78px" onchange="CALLUP_FILTER.max=Math.max(0,Math.min(99,+this.value||99));render()"></label></div><div id="callup-results" class="scroll" style="margin-top:12px">${callupResultsHtml()}</div></div><div class="card"><h2>🇧🇷 Lista de convocados</h2><p class="mu">${d.selected.length} de 26 jogadores</p>${d.selected.length?`<div class="scroll"><table><tr><th>Jogador</th><th>Nível</th><th></th></tr>${d.selected.map(x=>`<tr><td><b>${esc(x.p.n)}</b><br><small class="mu">${esc(x.t.name)} · ${esc(cn(x.c))} · ${x.p.p}</small></td><td>${x.p.o}</td><td><button class="sec" onclick="removeCallup('${x.ref}')">Retirar</button></td></tr>`).join('')}</table></div>`:'<p class="mu">Nenhum jogador convocado para esta competição ainda.</p>'}<button onclick="save();alert('Convocação salva nesta carreira.');" ${d.selected.length?'':'disabled'}>💾 Salvar convocação</button></div></div>`}
function callupResultsHtml(){const d=callupList();return d.list.length?`<table><tr><th>Jogador</th><th>Clube / campeonato</th><th>Nível</th><th></th></tr>${d.list.slice(0,150).map(x=>`<tr><td><b>${esc(x.p.n)}</b><br><small class="mu">${esc(x.p.p)} · ${esc(callupCountry(x.p))}</small></td><td>${esc(x.t.name)}<br><small class="mu">${esc(cn(x.c))}</small></td><td><b>${x.p.o}</b></td><td><button onclick="addCallup('${x.ref}')" ${d.refs.length>=26?'disabled':''}>+ Convocar</button></td></tr>`).join('')}</table>${d.list.length>150?'<p class="mu">Mostrando os 150 primeiros resultados. Refine os filtros para encontrar outros atletas.</p>':''}`:'<p class="mu">Nenhum jogador encontrado. Confira a nacionalidade cadastrada e ajuste os filtros.</p>'}

let CHAMP_BROWSE={ci:-1,q:""};
function normalizeClubName(name){return String(name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().replace(/\s+/g," ").toLocaleLowerCase("pt-BR")}
function compHistoryRows(c){
 const rows=[...(c&&c.lg&&Array.isArray(c.lg.hist)?c.lg.hist:[]),...(c&&Array.isArray(c.careerHist)?c.careerHist:[])];
 const seen=new Set();
 return rows.filter(h=>h&&h.c).filter(h=>{const k=String(h.y||"")+"|"+normalizeClubName(h.c);if(seen.has(k))return false;seen.add(k);return true})
  .sort((a,b)=>(+a.y||0)-(+b.y||0)||String(a.c).localeCompare(String(b.c),"pt-BR"));
}
function crestByName(name){
 if(!ROOT)return "";
 const key=normalizeClubName(name);
 for(const c of ROOT.comps||[]){const t=(c.teams||[]).find(x=>normalizeClubName(x.name)===key);if(t)return sh(t,26)}
 return "⚽";
}
function editorEnteredTitles(team){
 // O campo usado pelo Editor atual é team.hon. Se existir, ele é a fonte
 // oficial mesmo quando vazio; não cair em aliases antigos de histórico.
 if(!team)return [];
 if(Array.isArray(team.hon))return team.hon;
 if(typeof team.hon==="string"&&team.hon.trim())return team.hon.split(/\n/).map(n=>n.trim()).filter(Boolean);
 const fields=[team.titulos,team.titles,team.honours,team.honors,team.titulosHistoricos,team.historicalTitles,team.trophies];
 for(const value of fields){
  if(Array.isArray(value)&&value.length)return value;
  if(typeof value==="string"&&value.trim())return value.split(/\n/).map(n=>n.trim()).filter(Boolean);
 }
 return [];
}
function campTab2(){
 ROOT=load()||ROOT||{comps:[],cur:0};
 const comps=(ROOT.comps||[]).map((c,ci)=>({c,ci})).filter(x=>!x.c.globalHidden);
 const q=(CHAMP_BROWSE.q||"").toLocaleLowerCase("pt-BR");
 const filtered=comps.filter(({c})=>String(cn(c)).toLocaleLowerCase("pt-BR").includes(q)||String(ps(c)).toLocaleLowerCase("pt-BR").includes(q)||(c.teams||[]).some(t=>String(t.name).toLocaleLowerCase("pt-BR").includes(q)));
 if(!filtered.some(x=>x.ci===CHAMP_BROWSE.ci))CHAMP_BROWSE.ci=filtered.length?filtered[0].ci:-1;
 const selected=ROOT.comps[CHAMP_BROWSE.ci];
 const rows=selected?compHistoryRows(selected):[];
 const counts={};
 const titleImages={};
 const canonicalNames=new Map((selected&&selected.teams||[]).filter(t=>t&&!t.sel).map(t=>[normalizeClubName(t.name),String(t.name||"").trim()]));
 // O ranking desta tela é exclusivo da competição selecionada: conta apenas
 // campeões registrados no histórico dela, não troféus manuais de outros torneios.
 rows.forEach(h=>{
   const key=normalizeClubName(h.c);
   const name=canonicalNames.get(key)||String(h.c).trim();
   if(!key)return;
   if(!counts[key])counts[key]={name,count:0};
   counts[key].count++;
 });
 const ranking=Object.values(counts).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,"pt-BR"));
 const standings=selected&&Array.isArray(selected.teams)?[...selected.teams].sort((a,b)=>(+b.pts||0)-(+a.pts||0)||((+b.gp||0)-(+b.gc||0)-((+a.gp||0)-(+a.gc||0)))||(+b.gp||0)-(+a.gp||0)):[];
 return `<div class="club-browser">
  <div class="club-browser-head"><div><div class="club-eyebrow">CONSULTA DE COMPETIÇÕES</div><h1>Campeonatos</h1><div class="mu">Pesquise uma competição, veja os clubes com mais títulos e consulte o histórico de campeões.</div></div>
  <div class="club-search"><span>⌕</span><input aria-label="Pesquisar campeonato" placeholder="Pesquisar campeonato, país ou clube..." value="${esc(CHAMP_BROWSE.q)}" oninput="CHAMP_BROWSE.q=this.value;CHAMP_BROWSE.ci=-1;render()"></div></div>
  <div class="club-filters"><label>Campeonato<select onchange="CHAMP_BROWSE.ci=+this.value;render()">${filtered.map(x=>`<option value="${x.ci}" ${x.ci===CHAMP_BROWSE.ci?"selected":""}>${esc(cn(x.c))} · ${esc(ps(x.c))}</option>`).join("")}</select></label><span class="club-count">${filtered.length} competição(ões)</span></div>
  ${!selected?`<div class="card">Nenhum campeonato encontrado. Pesquise outro nome ou crie uma competição no Editor.</div>`:`
  <div class="club-detail-head"><div class="club-detail-identity">${selected.lg&&selected.lg.img?`<img src="${selected.lg.img}" alt="" style="width:58px;height:58px;object-fit:contain">`:lgLogoC(selected,58)}<div><div class="club-eyebrow">${esc(ps(selected))} · ${(selected.teams||[]).length} equipes</div><h2>${esc(cn(selected))}</h2><div class="mu">${selected.continental?"Competição continental":tp(selected)==="selecoes"?"Seleções nacionais":"Competição de clubes"}</div></div></div></div>
  <div class="club-results" style="margin-bottom:14px"><div class="club-results-title">📊 TABELA DO CAMPEONATO</div>
   ${standings.length?`<div class="club-roster-wrap"><table class="club-roster"><thead><tr><th>#</th><th>CLUBE / SELEÇÃO</th><th>PTS</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr></thead><tbody>${standings.map((t,i)=>`<tr><td class="club-number">${i+1}</td><td><div class="club-player">${crestByName(t.name)}<b>${esc(t.name)}</b></div></td><td><b>${+t.pts||0}</b></td><td>${+t.j||0}</td><td>${+t.v||0}</td><td>${+t.e||0}</td><td>${+t.d||0}</td><td>${(+t.gp||0)-(+t.gc||0)}</td></tr>`).join("")}</tbody></table></div>`:'<p class="mu" style="padding:12px">Esta competição ainda não tem clubes ou resultados registrados.</p>'}
  </div>
  <div class="club-info-grid">
   <div class="club-results"><div class="club-results-title">🏆 CLUBES COM MAIS TÍTULOS</div>
    ${ranking.length?`<div class="club-roster-wrap"><table class="club-roster"><thead><tr><th>#</th><th>CLUBE</th><th>TÍTULOS</th></tr></thead><tbody>${ranking.map((item,i)=>`<tr><td class="club-number">${i+1}</td><td><div class="club-player">${crestByName(item.name)}<b>${esc(item.name)}</b></div></td><td><span class="club-rating high">${item.count}</span></td></tr>`).join("")}</tbody></table></div>`:'<p class="mu" style="padding:12px">Ainda não há títulos registrados. Cadastre os campeões no Editor.</p>'}
   </div>
   <div class="club-results"><div class="club-results-title">📜 HISTÓRICO DE CAMPEÕES</div>
    ${rows.length?`<div style="padding:8px 13px">${rows.map(h=>`<div class="club-title-row" style="display:flex;align-items:center;gap:10px">${crestByName(h.c)}<span style="color:#b7f34a;font-weight:800;min-width:48px">${esc(h.y)}</span><b>${esc(h.c)}</b></div>`).join("")}</div>`:'<p class="mu" style="padding:12px">Nenhum campeão registrado ainda. Edite o histórico na aba Editor do campeonato.</p>'}
   </div>
  </div>`}
 </div>`;
}
function render(){if(G&&G.tab==="tabela")G.tab="jogo";const el=document.getElementById("app");
 document.getElementById("ttl").innerHTML="⚽ Football Brasil Manager";if(G)document.title=(G.teams&&G.teams[G.me]&&G.teams[G.me].name)||"Football Brasil Manager";document.getElementById("ttl").style.display=G?"none":(NC?"":"none");
 if(NC){el.innerHTML=ncForm();return}if(!G){el.innerHTML=homeScr();return}
 if(!G){const s=load();el.innerHTML=`<div class="card"><h2>Football Brasil Manager</h2><p class="mu">Crie e gerencie campeonatos pelo Editor no menu principal.</p><h2>Ou escolha um clube do campeonato de exemplo</h2><div class="grid">${TEAMS.map((t,i)=>`<button class="sec" onclick="newGame(${i});render()">${t}</button>`).join("")}</div>${s?`<p><button onclick="cont()">Continuar jogo salvo</button></p>`:""}</div>`;return}
 const me=G.teams[G.me]||{id:-1,name:"(sem clube)",sq:[],xi:[],form:"4-4-2",pts:0,ic:"⚽",col:"#888"};
 const nav=(G.tab==="editor"?`<button class="on">🛠️ Editor</button>`:["jogo","calendario","elenco","transferencias","ranking","campeoes","clubes","selecoes","carreira","empregos"].map(t=>`<button class="${G.tab==t?"on":"sec"}" onclick="G.tab='${t}';render()">${{jogo:"Tela Inicial",calendario:"Calendário",elenco:"Elenco",transferencias:"Transferências",ranking:"Ranking continental",campeoes:"Campeonatos",clubes:"Clubes",selecoes:"Seleções",convocacoes:"Convocações",editor:"Editor",carreira:"Minha carreira",empregos:"Empregos"}[t]}</button>`).join(""))+` <button class="sec" style="color:var(--rd);border-color:var(--rd)" onclick="deleteManagerCareer()">🗑 Excluir carreira</button> <button class="sec" onclick="HM='menu';G=null;render()">🏠 Menu</button> <button class="sec" onclick="saveSlot()">💾 Salvar</button>`;
 let b="";
 if(G.tab=="prejogo"){b=preGameScr()}
 if(G.tab=="jogo"){
  if(G.teams.length<2)b=`<div class="card">Crie pelo menos 2 clubes na aba <b>Editor</b> para começar o campeonato.</div>`;
  else if(G.rd>=G.fx.length){if(G.globalType==='fifa-intercontinental-cup'){const champ=(G.teams||[]).find(t=>t.id===G.interChampionId);b=`<div class="card"><h2>${champ?'🏆 Campeão da Copa Intercontinental!':esc(G.interStageName||'Fim da fase')}</h2>${champ?`<p class="score">${sh(champ,44)} ${esc(champ.name)}</p><p>A edição anual foi concluída em mata-mata, entre campeões continentais, sem uso do ranking.</p><button onclick="advanceIntercontinentalRound()">Registrar campeão</button>`:`<p>Fase ${Math.max(1,(G.interRound||0)+1)} concluída.</p><p class="mu">Os vencedores avançam para a próxima fase; em caso de empate, o jogo decide a classificação por desempate aleatório.</p><button onclick="advanceIntercontinentalRound()">Avançar para a próxima fase</button>`}</div>`}else{const t=table();b=`<div class="card"><h2>Fim de temporada!</h2><div style="text-align:center">${trophImg(100)}</div><p>Campeão: <b>${sh(t[0],44)} ${esc(t[0].name)}</b>. ${tp(G)==="selecoes"?"Sua seleção terminou em":"Seu clube terminou em"} ${t.findIndex(x=>x.id==G.me)+1}º lugar.</p>${G.linkedDivision?`<p class="mu">Ao confirmar, o jogo aplicará a promoção e o rebaixamento automaticamente se o campeonato vinculado pertencer ao mesmo sistema e estiver configurado como divisão adjacente.</p>`:""}<button onclick="endSeason()">Registrar temporada e iniciar a próxima</button></div>`}}
  else{const fm=G.fx[G.rd].find(([h,a])=>h==G.me||a==G.me),[hi,ai]=fm||[0,0];const lastHtml=G.last?`<div class="card"><h2>Rodada anterior</h2><p><b>${nm(G.last.h)} ${G.last.gh} x ${G.last.ga} ${nm(G.last.a)}</b></p>${G.last.others.map(o=>`<div class="mu">${nm(o.h)} ${o.gh} x ${o.ga} ${nm(o.a)}</div>`).join("")}</div>`:"";
   b=`<div class="card"><h2>Rodada ${G.rd+1} de ${G.fx.length} <span class="mu" style="font-weight:400">· ${fdate(dateOf(G,G.rd))}</span></h2>${fm?"":`<p>${tp(G)==="selecoes"?"Sua seleção não joga nesta rodada.":"Seu clube folga nesta rodada."}</p>`}<p style="font-size:18px;${fm?"":"display:none"}">${sh(G.teams[hi],26)} <b>${esc(G.teams[hi].name)}</b> x <b>${esc(G.teams[ai].name)}</b> ${sh(G.teams[ai],26)}</p><label>Velocidade <select onchange="SPD=+this.value;G.spd=SPD;save()">${spdOpts()}</select></label> <button onclick="${fm?"openPregame()":"playLive()"}">${fm?"⚽ Preparar partida":"⏭ Simular rodada"}</button>${fm?` <button class="sec" onclick="skipMatch()">⏭ Pular partida (resultado direto)</button>`:""}</div>`+lastHtml+bStandingsScorers()}}
 if(G.tab=="elenco"){
  const s=str(me),cnt=me.xi.length;
  b=`<div class="card"><div class="row"><label>Formação <select onchange="me_form(this.value)">${Object.keys(FORM).map(f=>`<option ${f==me.form?"selected":""}>${f}</option>`).join("")}</select></label><button class="sec" onclick="autoXI(G.teams[G.me]);save();render()">Auto-escalar</button><label>Ordenar <select onchange="G.sort=this.value;render()"><option value="o" ${(G.sort||'o')=='o'?'selected':''}>Nível</option><option value="p" ${G.sort=='p'?'selected':''}>Posição</option><option value="n" ${G.sort=='n'?'selected':''}>Nome</option></select></label><span class="${cnt==11?"":"goal"}" style="${cnt==11?"":"color:var(--rd)"}">${cnt}/11 titulares</span></div><p><label>Nível médio do time <input type="number" min="30" max="99" value="${ovr(me)}" style="width:64px" onchange="setOvr(this.value,${G.me})"></label></p><p class="mu">Ataque ${s.A.toFixed(0)} · Meio ${s.M.toFixed(0)} · Defesa ${s.D.toFixed(0)}. Toque num jogador para escalar/tirar.</p>
  <div class="scroll"><table><tr><th>Jogador</th><th>Pos</th><th>Nível</th><th>Classe</th><th>Gols</th></tr>${[...me.sq].sort(SORTS[G.sort||"o"]).map(p=>`<tr class="${me.xi.includes(p.id)?"sel":""}" onclick="tog(${p.id})" style="cursor:pointer"><td style="white-space:nowrap">${av(p,28)} ${esc(p.n)}</td><td><span class="pos">${p.p}</span></td><td><b>${p.o}</b></td><td class="mu">${lv(p.o)}</td><td>${p.g}</td></tr>`).join("")}</table></div></div>`}
 if(G.tab=="editor")b=edB();
 if(G.tab=="carreira")b=careerScr();
 if(G.tab=="clubes")b=clubesScr();
 if(G.tab=="selecoes")b=selecoesScr();
 if(G.tab=="convocacoes")b=callupScr();
 if(G.tab=="campeoes")b=campTab2();
 if(G.tab=="calendario")b=calTab();
 if(G.tab=="transferencias")b=trTab();
 if(G.tab=="ranking")b=rankingCareerScr();

 el.innerHTML=`<div class="card"><div class="row" style="gap:10px;align-items:center">${sh(me,34)} <b>${esc(me.name)}</b></div></div><nav>${nav}</nav>`+b}
function tog(id){const t=G.teams[G.me],i=t.xi.indexOf(id);if(i>=0)t.xi.splice(i,1);else if(t.xi.length<11)t.xi.push(id);save();render()}
function me_form(f){G.teams[G.me].form=f;autoXI(G.teams[G.me]);save();render()}

function exportGameBackup(){
  const data={format:"football-brasil-manager-backup",version:1,mm2:gameStorage.getItem("mm2"),mm1:gameStorage.getItem("mm1"),mm_saves:gameStorage.getItem("mm_saves")};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="football-brasil-manager-backup.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  alert("Backup exportado. Guarde o arquivo em um local seguro.");
}
function importGameBackup(input){
  const file=input.files&&input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data||data.format!=="football-brasil-manager-backup")throw new Error("Formato inválido");
      ["mm2","mm1","mm_saves"].forEach(k=>{if(data[k]!==undefined&&data[k]!==null)gameStorage.setItem(k,data[k]);else gameStorage.removeItem(k)});
      alert("Backup importado. A página será recarregada.");
      location.reload();
    }catch(e){alert("Não foi possível importar. Selecione um backup exportado pelo Football Brasil Manager.")}
    input.value="";
  };
  reader.readAsText(file);
}

render();
